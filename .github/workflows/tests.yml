name: tests

on:
  push:
    branches:
      - "ci/linux-bool-dealloc-probe"

permissions:
  contents: read

jobs:
  probe:
    name: probe (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: uv sync --locked --all-extras
      - name: A core only
        continue-on-error: true
        run: uv run pytest -q --ignore=tests/gui
      - name: B gui without conversion tests
        continue-on-error: true
        run: uv run pytest -q tests/gui --ignore=tests/gui/test_gui_conversion.py
      - name: C conversion tests all
        continue-on-error: true
        run: uv run pytest -q tests/gui/test_gui_conversion.py
      - name: D conversion selection-only
        continue-on-error: true
        run: uv run pytest -q tests/gui/test_gui_conversion.py -k "choices or disabled or resets or keeps or pftrack_controls or role_has or requires_complete or empty_shot"
      - name: E conversion golden runs
        continue-on-error: true
        run: uv run pytest -q tests/gui/test_gui_conversion.py -k "golden"
      - name: F conversion error presentation
        continue-on-error: true
        run: uv run pytest -q tests/gui/test_gui_conversion.py -k "error or failure or success or usable or collision"
      - name: G conversion app spies
        continue-on-error: true
        run: uv run pytest -q tests/gui/test_gui_conversion.py -k "calls_tracker_tool_app"
      - name: H one MainWindow then exit
        continue-on-error: true
        run: uv run python -c "from PySide6.QtWidgets import QApplication; a=QApplication([]); from tracker_tool_gui.main_window import MainWindow; w=MainWindow(); w.show(); a.processEvents(); print('ok')"
      - name: I one SourceSection then exit
        continue-on-error: true
        run: uv run python -c "from PySide6.QtWidgets import QApplication; a=QApplication([]); from tracker_tool_gui.selection import SourceSection; s=SourceSection(); s.show(); a.processEvents(); print('ok')"
