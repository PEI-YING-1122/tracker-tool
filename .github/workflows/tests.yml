name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      # GUI tests run headless; Core tests ignore this.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install project
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest -v

  package-windows:
    name: package (windows-latest)
    needs: pytest
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - name: Install project
        run: uv sync --locked --all-extras --group packaging

      - name: Build GUI bundle
        run: uv run --group packaging python packaging/build_gui.py

      - name: Smoke-test GUI bundle
        run: uv run python packaging/smoke_test_frozen.py dist/TrackerTool/TrackerTool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TrackerTool-windows-${{ github.sha }}
          path: dist/TrackerTool
          retention-days: 14
